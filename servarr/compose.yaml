name: servarr

x-arcane:
  icon: ${COMPOSE_PROJECT_NAME}
  urls:
    - qbittorrent.${DOMAIN}
    - radarr.${DOMAIN}
    - sonarr.${DOMAIN}
    - prowlarr.${DOMAIN}
    - lidarr.${DOMAIN}
    - readarr.${DOMAIN}

#############################################
# common properties fragments
#############################################

x-logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-common-env: &common-env
    PUID: 1000
    PGID: 1000
    TZ: ${TZ}

x-common-keys: &common-keys
    restart: unless-stopped
    environment: *common-env
    logging: *logging

x-proxy-common: &proxy-common
    <<: *common-keys
    networks:
      - default  # Keeps it on arr_network
      - proxy    # Adds it to proxy network for Traefik

# Merged into each service's map-form labels with `<<: *traefik`
x-traefik: &traefik
    traefik.enable: "true"
    traefik.docker.network: proxy

#############################################
# ARR Stack Dedicated Network
#############################################

networks:
  default:
    name: arr_network
  proxy:
    external: true

services:
#############################################
# GLUETUN - VPN Gateway
#############################################
  gluetun:
    <<: *proxy-common
    container_name: gluetun
    image: qmcgaw/gluetun:v3.41@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    env_file:
      - .env.vpn.secrets
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/shared/gluetun:/tmp/gluetun
      - /docker/appdata/gluetun:/gluetun
    # No torrent port mapping: the VPN forwards a dynamic port (see /docker/shared/gluetun/forwarded_port),
    # which qb-port-sync pushes to qBittorrent. A fixed host mapping would not match it.
    labels:
      <<: *traefik
      arcane.icon: gluetun
      # qBittorrent shares this network namespace, so its web UI route lives here
      traefik.http.routers.qbittorrent.tls: "true"
      traefik.http.routers.qbittorrent.entrypoints: https
      traefik.http.routers.qbittorrent.rule: Host(`qbittorrent.${DOMAIN}`)
      traefik.http.routers.qbittorrent.tls.certresolver: cloudflare
      traefik.http.services.qbittorrent.loadbalancer.server.port: "8080"

#############################################
# QBITTORRENT (via VPN) + Port Updater
#############################################
  qbittorrent:
    <<: *common-keys
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent@sha256:ec7a0c3cdf1258dbd5f395261b5d341b63655850d0f44d246dd56668dcfcfe7f
    network_mode: "service:gluetun"
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    labels:
      arcane.icon: qbittorrent
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/qbittorrent:/config
      - /data:/data
      - ./qbit-hardlink:/scripts

  qb-port-sync:
    container_name: qb-port-sync
    image: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: unless-stopped
    logging: *logging
    network_mode: "service:gluetun"
    command: ["sh", "/update-port.sh"]
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - POLL_INTERVAL=30
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/shared/gluetun:/tmp/gluetun:ro
      - ./update-port.sh:/update-port.sh:ro
    labels:
      - arcane.icon=alpine-linux

#############################################
# RADARR - Movies
#############################################
  radarr:
    <<: *proxy-common
    container_name: radarr
    image: ghcr.io/hotio/radarr@sha256:853a3efcf10dc4141963b39e95284291cc4f9e18ff7dd4b7de2526a538032cf5
    labels:
      <<: *traefik
      arcane.icon: radarr
      traefik.http.routers.radarr.tls: "true"
      traefik.http.routers.radarr.entrypoints: https
      traefik.http.routers.radarr.rule: Host(`radarr.${DOMAIN}`)
      traefik.http.routers.radarr.tls.certresolver: cloudflare
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/radarr:/config
      - /data:/data

#############################################
# SONARR - TV Shows
#############################################
  sonarr:
    <<: *proxy-common
    image: ghcr.io/hotio/sonarr@sha256:cf0d229e406574dc31a1490ea98bbb4d55706b8bb69b4ebe64a071b9fd3148db
    container_name: sonarr
    labels:
      <<: *traefik
      arcane.icon: sonarr
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr.entrypoints: https
      traefik.http.routers.sonarr.rule: Host(`sonarr.${DOMAIN}`)
      traefik.http.routers.sonarr.tls.certresolver: cloudflare
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sonarr:/config
      - /data:/data

#############################################
# LIDARR - Music
#############################################
  lidarr:
    <<: *proxy-common
    image: ghcr.io/hotio/lidarr@sha256:547a4fa6ec02ff4dfec60089722ce710f0833b8c808eb52d0b6fc964db12604e
    container_name: lidarr
    labels:
      <<: *traefik
      arcane.icon: lidarr
      traefik.http.routers.lidarr.tls: "true"
      traefik.http.routers.lidarr.entrypoints: https
      traefik.http.routers.lidarr.rule: Host(`lidarr.${DOMAIN}`)
      traefik.http.routers.lidarr.tls.certresolver: cloudflare
      traefik.http.services.lidarr.loadbalancer.server.port: "8686"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/lidarr:/config
      - /data:/data

#############################################
# PROWLARR - Indexer Manager
#############################################
  prowlarr:
    <<: *proxy-common
    image: ghcr.io/hotio/prowlarr@sha256:260285d5fc6f485cef9f2efedc5068829746dd211d8d80a97a5219a2e927e487
    container_name: prowlarr
    labels:
      <<: *traefik
      arcane.icon: prowlarr
      traefik.http.routers.prowlarr.tls: "true"
      traefik.http.routers.prowlarr.entrypoints: https
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.${DOMAIN}`)
      traefik.http.routers.prowlarr.tls.certresolver: cloudflare
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/prowlarr:/config

#############################################
# READARR - Books
#############################################
  readarr:
    <<: *proxy-common
    image: ghcr.io/pennydreadful/bookshelf@sha256:67498dd5ece516867d72ee642abd6c1a66b36a135c8f7da0127109564372beb1
    container_name: readarr
    labels:
      <<: *traefik
      arcane.icon: readarr
      traefik.http.routers.readarr.tls: "true"
      traefik.http.routers.readarr.entrypoints: https
      traefik.http.routers.readarr.rule: Host(`readarr.${DOMAIN}`)
      traefik.http.routers.readarr.tls.certresolver: cloudflare
      traefik.http.services.readarr.loadbalancer.server.port: "8787"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/bookshelf:/config
      - /data:/data

# Optional: Add proxy for MAM
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   container_name: flaresolverr
  #   environment:
  #     - LOG_LEVEL=info
  #   ports:
  #     - 8191:8191
  #   restart: unless-stopped

  # Reached by readarr over arr_network at http://rreading-glasses:8788 (no host port needed)
  rreading-glasses:
    depends_on:
      rreading-glasses-db:
        condition: service_healthy
    image: blampe/rreading-glasses@sha256:3f017a51d9007b715303a20f481c822e4df66485fc9e5f57f6fdf1de840dc02f
    container_name: rreading-glasses
    hostname: rreading-glasses
    entrypoint: ["/main", "serve"]
    command:
      - --verbose
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    env_file:
      - .env.rreading.secrets

  rreading-glasses-db:
    image: postgres@sha256:c6222b54873a2fb19591cb06b93ef2825c03cdb680396e3600f24921f340f630
    container_name: rreading-glasses-db
    hostname: rreading-glasses-db
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env.rreading.secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rreading-glasses -d rreading-glasses"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rreading_glasses_data:/var/lib/postgresql/data

  # seerr:
  #   <<: *proxy-common
  #   image: ghcr.io/seerr-team/seerr:${SEER_RELEASE_TAG:-latest}
