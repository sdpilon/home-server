  #   ports:
  #     - ${SEERR_PORT:-5055}:5055
  #   environment:
  #     TZ: ${TZ}
  #     #LOG_LEVEL: debug
  #   volumes:
  #     - /docker/appdata/config:/app/config
  #   healthcheck:
  #     test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
  #     start_period: 20s
  #     timeout: 3s
  #     interval: 15s
  #     retries: 3
  #   labels:
  #     arcane.icon: seerr

volumes:
  rreading_glasses_data:
