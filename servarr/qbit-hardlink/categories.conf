# categories.conf
#
# One mapping per line: category=/absolute/destination/directory
# The category name must match exactly what's set in qBittorrent (Tools >
# Options > Downloads > Categories, or Torrent > Category).
#
# Rename this file to categories.conf (or point the script at it with -c)
# and edit the paths for your setup. Destination directories must live on
# the same filesystem/mount as your qBittorrent downloads for hardlinks to
# work — if you're on ZFS, that means the same pool/dataset; NFS-mounted
# destinations on a different export will fail the same-device check.



# Leave TV/movies out of this file entirely if Sonarr/Radarr already
# import those categories themselves — you don't want both hardlinking
# the same files into two different places.
