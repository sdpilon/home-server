storage:
  type: sqlite
  path: /data/data.db

alerting:
  ntfy:
    url: "https://ntfy.${DOMAIN}"
    topic: "homelab-routine"
    priority: 3
    default-alert:
      failure-threshold: 4
      success-threshold: 2
      send-on-resolved: true
    overrides:
      - group: critical
        topic: "homelab-critical"
        priority: 5

endpoints:
  # --- critical: broad-impact infrastructure. Fast alert, low threshold. ---
  - name: traefik
    group: critical
    url: "https://traefik.${DOMAIN}"
    interval: 60s
    conditions:
      - "[STATUS] < 500" # dashboard is behind basic auth, so 401 is a healthy response
    alerts:
      - type: ntfy
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
        description: "Reverse proxy unreachable - likely means most of the homelab is unreachable"

  - name: arcane
    group: critical
    url: "https://arcane.${DOMAIN}/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
    alerts:
      - type: ntfy
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
        description: "Arcane unhealthy - this also covers its docker-socket-proxy sidecar, since the health endpoint checks both"

  - name: ntfy
    group: critical
    url: "https://ntfy.${DOMAIN}/v1/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
        description: "ntfy itself is unreachable - note: if this is down, you won't get this alert either. Check the Gatus dashboard directly."

  # --- routine: individual apps. Higher threshold to absorb blips, alert-only default. ---
  - name: jellyfin
    group: routine
    url: "https://jellyfin.${DOMAIN}"
    interval: 60s
    conditions:
      - "[STATUS] < 400" # jellyfin redirects (302) to its web UI at the root path
    alerts:
      - type: ntfy

  - name: immich
    group: routine
    url: "https://immich.${DOMAIN}"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

