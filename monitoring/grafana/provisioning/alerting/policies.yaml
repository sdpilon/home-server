apiVersion: 1
policies:
- orgId: 1
  receiver: ntfy-routine
  group_by:
  - alertname
  - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - receiver: ntfy-critical
    object_matchers:
    - - severity
      - '='
      - critical
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
    continue: false
