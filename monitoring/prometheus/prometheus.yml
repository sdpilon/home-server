global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: qbittorrent
    static_configs:
      - targets: ["qbittorrent-exporter:8090"]

  - job_name: nas
    static_configs:
      - targets: ["172.16.1.3:9100"]
        labels:
          instance: zimbian
          role: nas

  - job_name: nas-smart
    static_configs:
      - targets: ["172.16.1.3:9633"]
        labels:
          instance: zimbian
          role: nas
