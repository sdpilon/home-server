name: chatbridge

x-arcane:
  icon: docker

# Deployment for the chatbridge project. The source, agent definition and
# Dockerfile live in the project repository at /home/sp/chatbridge; this stack
# holds only the compose file, the .env and the Delta Chat account under ./data.
#
# Host networking is required: the OpenCode background service binds to
# 127.0.0.1 only, so the container must share the host network namespace.
services:
  chatbridge:
    container_name: chatbridge
    image: chatbridge:local
    build:
      context: /home/sp/chatbridge
    restart: unless-stopped
    # reap the deltachat-rpc-server child process cleanly
    init: true
    network_mode: host
    env_file:
      - .env
    environment:
      OPENCODE_URL: http://127.0.0.1:49374
      OPENCODE_PASSWORD_FILE: /opencode/service.json
      OPENCODE_SESSION_DIR: /home/sp/chatbridge/agent
      DC_CONFIG_DIR: /data/dc
      STATE_DB: /data/state.sqlite
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Delta Chat account database + bridge state
      - ./data:/data
      # OpenCode service credentials (HTTP Basic: opencode / <password>)
      - /home/sp/.config/opencode/service.json:/opencode/service.json:ro
      # The host's OpenCode service reads the agent definition from here; the
      # container only needs the path to exist, so mount it read-only at the
      # same location rather than sharing the whole project directory.
      - /home/sp/chatbridge/agent:/home/sp/chatbridge/agent:ro
